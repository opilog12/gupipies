<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <title data-i18n="secretPageTitle">Tajemnicza strona</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/icon/ikona.png">
  <script src="js/translations.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/secret.js" defer></script>
</head>
<body class="secret-page">
  <header class="site-header">
    <a class="logo" href="index.html">GUPI<span>PIES</span></a>
    <nav>
      <a href="index.html" data-i18n="navHome">Główna</a>
      <a href="players.html" data-i18n="navPlayers">Gracze</a>
      <a href="news.html" data-i18n="navNews">Aktualności</a>
      <a href="games.html" data-i18n="navGames">Gry</a>
    </nav>
    <div class="language-switch">
      <button type="button" data-lang="pl">PL</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <main class="page-main secret-main">
    <section class="secret-card">
      <p class="eyebrow" data-i18n="secretPageTitle">Tajemnicza strona</p>
      <h1 data-i18n="secretPageHeading">Znalazłeś tajemnicze przejście...</h1>
      <p data-i18n="secretPageText">Wprowadź hasło, aby przejść dalej.</p>
      <form id="secret-password-form" class="secret-form">
        <label for="secret-password" data-i18n="secretPasswordLabel">Hasło</label>
        <input id="secret-password" type="password" autocomplete="off"
          placeholder="Wpisz hasło..." data-i18n-placeholder="secretPasswordPlaceholder" required>
        <button class="button button-primary" type="submit" data-i18n="secretPasswordSubmit">Odblokuj</button>
      </form>
      <p id="secret-password-feedback" class="game-feedback" aria-live="polite"></p>
    </section>
  </main>

  <footer class="site-footer">
    <span>© <span id="year"></span> Opilog12</span>
    <span data-i18n="footerText">Stworzone dla naszej społeczności.</span>
  </footer>
</body>
</html>
