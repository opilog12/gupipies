
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111d">
  <title data-i18n="playersTitle">Gracze - Gupi Pies Site</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/translations.js" defer></script>
  <link rel="icon" href="images/icon/ikona.png">
  <script src="js/app.js" defer></script>
</head>
<body class="players-page">
  <header class="site-header">
    <a class="logo" href="index.html">GUPI<span>PIES</span></a>
    <nav>
      <a href="index.html" data-i18n="navHome">Główna</a>
      <a class="active" href="players.html" data-i18n="navPlayers">Gracze</a>
      <a href="news.html" data-i18n="navNews">Aktualności</a>
    </nav>
    <div class="language-switch">
      <button type="button" data-lang="pl">PL</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <main class="page-main">
    <section class="page-intro">
      <p class="eyebrow" data-i18n="playersEyebrow">NASZA EKIPA</p>
      <h1 data-i18n="playersHeading">Poznaj graczy</h1>
      <p data-i18n="playersText">Kliknij gracza, aby poznać go bliżej.</p>
    </section>

    <div class="search-wrap">
      <label class="sr-only" for="player-search" data-i18n="searchLabel">Szukaj gracza</label>
      <input id="player-search" type="search"
        data-i18n-placeholder="searchPlaceholder"
        placeholder="Wpisz nick gracza...">
    </div>

    <section class="player-grid" id="player-list" aria-label="Players"></section>
    <p class="empty-state hidden" id="players-empty" data-i18n="noPlayers">
      Nie znaleziono graczy.
    </p>
  </main>

  <dialog id="player-dialog" class="player-dialog">
    <button type="button" class="dialog-close" id="close-player"
      aria-label="Close">×</button>
    <div id="player-profile"></div>
  </dialog>

  <footer class="site-footer">
    <span>© <span id="year"></span> Opilog12</span>
    <span data-i18n="footerText">Stworzone dla naszej społeczności.</span>
  </footer>
</body>
</html>
